<!DOCTYPE html>
<html lang="id">
<head>
    <!-- ==========================================================================
         APLIKASI GANBOOK SALES - TOKO ONLINE KOMIK FISIK
         Halaman: Pendaftaran Pelanggan Baru (Register Page)
         Deskripsi: Formulir registrasi mandiri bagi pembeli komik untuk membuat akun pelanggan.
         ========================================================================== -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun Pelanggan - GanBook Sales</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- CSS Utama GanBook Sales -->
  <script type="module" crossorigin src="/assets/register-D8vsegqS.js"></script>
  <link rel="modulepreload" crossorigin href="/assets/script-Cjw_6am7.js">
  <link rel="modulepreload" crossorigin href="/assets/auth-DiYHd1L4.js">
  <link rel="stylesheet" crossorigin href="/assets/script-DDq6NZ6v.css">
</head>
<body style="background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 30px 20px;">

    <div style="background-color: #ffffff; border-radius: 16px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.25); width: 100%; max-width: 520px; overflow: hidden;">
        <!-- Header Kartu Register -->
        <div style="background-color: #f8fafc; padding: 26px; text-align: center; border-bottom: 1px solid var(--border-color);">
            <div style="width: 54px; height: 54px; background: linear-gradient(135deg, var(--primary-color), #3b82f6); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #ffffff; margin: 0 auto 10px;">
                <i class="fas fa-user-plus"></i>
            </div>
            <h2 style="font-size: 1.35rem; font-weight: 800; color: var(--text-primary);">Daftar Akun Pelanggan</h2>
            <p style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 4px;">Bergabunglah untuk memesan komik favorit Anda dengan mudah</p>
        </div>

        <!-- Konten Form Registrasi -->
        <div style="padding: 26px;">
            <!-- Alert Status / Galat -->
            <div id="registerAlert" class="alert" style="display: none;"></div>

            <form id="registerForm">
                <div class="form-group">
                    <label for="regName" class="form-label"><i class="fas fa-user"></i> Nama Lengkap <span style="color: var(--danger-color);">*</span></label>
                    <input type="text" id="regName" class="form-control" placeholder="Contoh: Budi Pratama" required>
                </div>

                <div class="form-group">
                    <label for="regEmail" class="form-label"><i class="fas fa-envelope"></i> Alamat Email <span style="color: var(--danger-color);">*</span></label>
                    <input type="email" id="regEmail" class="form-control" placeholder="nama@email.com" required>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                    <div class="form-group">
                        <label for="regPhone" class="form-label"><i class="fas fa-phone"></i> Nomor HP / WA</label>
                        <input type="text" id="regPhone" class="form-control" placeholder="081234567890">
                    </div>
                    <div class="form-group">
                        <label for="regAddress" class="form-label"><i class="fas fa-map-marker-alt"></i> Kota / Alamat</label>
                        <input type="text" id="regAddress" class="form-control" placeholder="Contoh: Jakarta Barat">
                    </div>
                </div>

                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                    <div class="form-group">
                        <label for="regPassword" class="form-label"><i class="fas fa-lock"></i> Kata Sandi <span style="color: var(--danger-color);">*</span></label>
                        <input type="password" id="regPassword" class="form-control" placeholder="Minimal 6 karakter" required minlength="6">
                    </div>
                    <div class="form-group">
                        <label for="regPasswordConfirm" class="form-label"><i class="fas fa-check-circle"></i> Konfirmasi <span style="color: var(--danger-color);">*</span></label>
                        <input type="password" id="regPasswordConfirm" class="form-control" placeholder="Ulangi kata sandi" required minlength="6">
                    </div>
                </div>

                <button type="submit" id="btnSubmitRegister" class="btn btn-primary" style="width: 100%; padding: 12px; margin-top: 10px; font-size: 0.95rem;">
                    <i class="fas fa-user-plus"></i> Daftar Akun Pelanggan
                </button>
            </form>

            <div style="margin-top: 20px; text-align: center; font-size: 0.88rem; color: var(--text-secondary);">
                Sudah memiliki akun? <a href="login.html" style="font-weight: 700;">Masuk di sini</a>
            </div>

            <div style="margin-top: 15px; text-align: center;">
                <a href="index.html" style="font-size: 0.85rem; color: var(--text-muted);"><i class="fas fa-arrow-left"></i> Kembali ke Beranda Toko</a>
            </div>
        </div>
    </div>

    <!-- Script Modul JavaScript -->
</body>
</html>
